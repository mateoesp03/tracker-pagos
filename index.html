<style>
:root{--cafed:#1356A4;--cafed-osc:#0C3D77;--rojo:#EE3427;
 --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
 --sans:system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;font-family:var(--sans);
 background:linear-gradient(140deg,var(--cafed-osc),var(--cafed));color:#fff}
.caja{width:100%;max-width:420px;background:#fff;color:#1C1917;border-radius:14px;
 padding:30px 28px;box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center}
.caja img{width:74px;height:auto;margin:0 auto 16px}
h1{font-size:19px;margin:0 0 6px;letter-spacing:-.015em}
p{margin:0 0 20px;font-size:13.5px;color:#57534E;line-height:1.5}
label{display:block;text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
 text-transform:uppercase;color:#8C857A;margin-bottom:6px}
input{width:100%;font-family:var(--sans);font-size:15px;padding:11px 13px;border:1px solid #CFC8B9;
 border-radius:7px;background:#fff;color:#1C1917}
input:focus{outline:2px solid var(--cafed);outline-offset:-1px;border-color:var(--cafed)}
button{width:100%;margin-top:14px;font-family:var(--sans);font-size:15px;font-weight:640;
 padding:11px;border:0;border-radius:7px;background:var(--cafed);color:#fff;cursor:pointer}
button:hover{background:var(--cafed-osc)}
button:disabled{opacity:.6;cursor:progress}
.error{margin:14px 0 0;font-size:13px;color:var(--rojo);min-height:19px}
.pie{margin:20px 0 0;font-family:var(--mono);font-size:10.5px;color:#8C857A}

const ITER = 250000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('b'), err = document.getElementById('e');
  const frase = document.getElementById('c').value.normalize('NFKC');
  if (!frase) return;
  btn.disabled = true; btn.textContent = 'Abriendo...'; err.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(frase),
      'PBKDF2', false, ['deriveKey']);
    const clave = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SAL), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, clave, b64(DAT));
    const html = new TextDecoder().decode(claro);
    document.open(); document.write(html); document.close();
  } catch (x) {
    btn.disabled = false; btn.textContent = 'Entrar';
    err.textContent = 'Frase incorrecta. Vuelve a intentarlo.';
    document.getElementById('c').select();
  }
});
